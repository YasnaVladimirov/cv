name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Node floor is 22.13, not Astro 7's 22.12 — pnpm 11.23 raises it.
      # Running 24.x here to match local development.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Verify theme
        run: pnpm verify:theme

      - name: Verify fonts
        run: pnpm verify:fonts

      - name: Verify i18n parity
        run: pnpm verify:i18n

      - name: Verify content integrity
        run: pnpm verify:content

      - name: Verify no invented values
        run: pnpm verify:values

      - name: Build
        run: pnpm build

      # These three read dist/, not src/ — they check what was actually emitted.
      - name: Verify no gradients
        run: pnpm verify:gradients

      - name: Verify built CSS
        run: pnpm verify:css

      - name: Verify no flash of English
        run: pnpm verify:no-flash

      - name: Verify metadata
        run: pnpm verify:metadata

      # The project's only automated WCAG gate (accessibility = 1), plus the
      # performance floor. Runs against dist/ with lhci's own static server,
      # so it needs no deployment. Ubuntu runners ship Chrome.
      - name: Lighthouse CI
        run: pnpm lhci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 7
